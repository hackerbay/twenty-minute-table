# Originally generated by the Firebase CLI, then kept deliberately.
#
# Every pull request gets a preview URL. There is no build step and that is
# correct: site/ is committed, and ci.yml fails any pull request whose site/
# does not match what its recipes/ generate, so what gets previewed is what the
# sources produce. Adding a build here would duplicate CI and need Python and
# Chromium on top.
#
# This deploys to a preview channel only. Live deploys come from release.yml on
# the `release` branch. The `if` below keeps the service account away from pull
# requests opened from forks.

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TWENTY_MINUTE_TABLE }}
          projectId: twenty-minute-table
